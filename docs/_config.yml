title: Black Bag Security
description: >-
  Security testing and engineering for high-consequence systems. Senior-led
  penetration testing, red teaming, secure code review, reverse engineering,
  AI security, and secure systems engineering with defensible evidence and
  verified closure.
url: "https://www.blackbagsecurity.com"
baseurl: ""
lang: en

include:
  - .well-known

# The reimagined site is English-only. Legacy localized content remains in
# repository history/source but is excluded from the redesigned build and sitemap.
# Trailing slashes keep these exclusions directory-specific.
exclude:
  - ar/
  - de/
  - es/
  - fr/
  - he/
  - ja/
  - ko/
  - pt-br/
  - th/

plugins:
  - jekyll-sitemap

# Temporary maintenance notice toggle.
maintenance_notice_enabled: false
