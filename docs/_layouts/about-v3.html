<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="msvalidate.01" content="1FE51893A5AC95D625ED3C04BA06D71C">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; form-action 'self'">
  <meta name="theme-color" content="#030b11">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <title>{{ page.title | default: site.title }}</title>
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:image" content="{{ page.social_image | absolute_url }}">
  <meta property="og:image:alt" content="{{ page.social_image_alt | escape }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{{ '/assets/css/about-v3.css' | relative_url }}">
  <link rel="icon" href="data:,">
  <script type="application/ld+json" src="{{ '/assets/data/organization.json' | relative_url }}"></script>
  <script type="application/ld+json" src="{{ '/assets/data/website.json' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/site-design-system-v1.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site-design-system-v1-header.css' | relative_url }}">
  <script src="{{ '/assets/js/site-design-system-v1-header.js' | relative_url }}" defer></script>
</head>
<body class="about-v3-site">
  <a class="about-skip" href="#content">Skip to content</a>
  <div class="about-site-shell ds-v1-shell">
    {% include site-design-system-v1-header.html %}
    <main id="content">{{ content }}</main>
    <footer class="about-footer">
      <div class="about-footer__brand">BLACK BAG SECURITY</div>
      <div class="about-footer__philosophy">PEOPLE <span>/</span> PERSPECTIVE <span>/</span> PROGRESS</div>
      <nav class="about-footer__nav" aria-label="Footer navigation">
        <a href="{{ '/' | relative_url }}">HOME</a>
        <a href="{{ '/services/' | relative_url }}">SERVICES</a>
        <a href="{{ '/capability/' | relative_url }}">CAPABILITY</a>
        <a aria-current="page" href="{{ '/about/' | relative_url }}">ABOUT</a>
        <a href="{{ '/about/#contact' | relative_url }}">CONTACT</a>
      </nav>
      <span class="about-footer__rule" aria-hidden="true"></span>
    </footer>
  </div>
</body>
</html>
