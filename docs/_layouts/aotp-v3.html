<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <meta name="msvalidate.01" content="1FE51893A5AC95D625ED3C04BA06D71C" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; form-action 'self'" />
  <meta name="theme-color" content="#030b11" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <title>{{ page.title | default: site.title }}</title>
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | strip | escape }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="{{ site.title | escape }}" />
  <meta property="og:image" content="{{ page.social_image | absolute_url }}" />
  <meta property="og:image:alt" content="{{ page.social_image_alt | escape }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="{{ '/assets/css/aotp-v3.css' | relative_url }}" />
  <link rel="icon" href="data:," />
  <script type="application/ld+json" src="{{ '/assets/data/organization.json' | relative_url }}"></script>
  <script type="application/ld+json" src="{{ '/assets/data/website.json' | relative_url }}"></script>
</head>
<body class="aotp-v3-site">
  <a class="aotp-skip" href="#content">Skip to content</a>
  <div class="aotp-site-shell">
    <header class="aotp-header">
      <a class="aotp-brand-lockup" href="{{ '/' | relative_url }}" aria-label="Black Bag Security home">
        <span class="aotp-brand">BLACK BAG SECURITY</span>
        <span class="aotp-brand__descriptor">RESEARCH&nbsp; | &nbsp;ENGINEERING&nbsp; | &nbsp;OPERATIONS</span>
      </a>
      <nav class="aotp-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/services/' | relative_url }}">Services</a>
        <a class="is-active" aria-current="page" href="{{ '/capability/' | relative_url }}">Capability</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/about/#contact' | relative_url }}">Contact</a>
      </nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer class="aotp-footer">
      <div class="aotp-footer__brand-lockup">
        <div class="aotp-footer__brand">BLACK BAG SECURITY</div>
        <div class="aotp-footer__descriptor">RESEARCH&nbsp; | &nbsp;ENGINEERING&nbsp; | &nbsp;OPERATIONS</div>
      </div>
      <nav class="aotp-nav aotp-nav--footer" aria-label="Footer navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/services/' | relative_url }}">Services</a>
        <a class="is-active" aria-current="page" href="{{ '/capability/' | relative_url }}">Capability</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/about/#contact' | relative_url }}">Contact</a>
      </nav>
    </footer>
  </div>
</body>
</html>
