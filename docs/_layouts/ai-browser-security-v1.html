<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; form-action 'self'">
  <meta name="theme-color" content="#06111a">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <title>{{ page.title | default: site.title }}</title>
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:image" content="{{ page.social_image | absolute_url }}">
  <meta property="og:image:alt" content="{{ page.social_image_alt | escape }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="{{ '/assets/img/ai-browser-security-v1/ai-browser-security-v1-hero.webp' | relative_url }}" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="{{ '/assets/css/ai-browser-security-v1.css' | relative_url }}">
  <link rel="icon" href="data:,">
  <script type="application/ld+json" src="{{ '/assets/data/organization.json' | relative_url }}"></script>
  <script type="application/ld+json" src="{{ '/assets/data/website.json' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/site-design-system-v1.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site-design-system-v1-header.css' | relative_url }}">
  <script src="{{ '/assets/js/site-design-system-v1-header.js' | relative_url }}" defer></script>
  <link rel="stylesheet" href="{{ '/assets/css/site-design-system-v1-footer.css' | relative_url }}">
  <script src="{{ '/assets/js/site-design-system-v1-footer.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="abs-skip" href="#abs-content">Skip to content</a>
  <div class="abs-shell ds-v1-shell" id="top">
    {% include site-design-system-v1-header.html %}
    <main id="abs-content">{{ content }}</main>
    {% include site-design-system-v1-footer.html %}
  </div>
</body>
</html>
